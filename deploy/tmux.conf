# Tmux settings for the d-brain brain session.
#
# NO LONGER PURELY INFORMATIONAL (B4 fix): ClaudeSession passes
# THIS FILE to tmux via `-f` on the very invocation that runs `new-session`
# (see runtime.py's `tmux_conf` / claude_session.py's `_ensure_locked`). That
# is what covers a COLD tmux server (e.g. right after a reboot): the
# warm-path fix below (`set-option -g history-limit 50000` issued BEFORE
# `new-session`, R4 fix — the previous per-session `-t` call
# AFTER new-session was a silent no-op, since history-limit is fixed at
# window creation time) only works if a tmux SERVER already exists to hold
# the global default; on a cold start there is no server yet, so that
# `set-option -g` call itself fails before it can do anything, and
# `new-session` falls back to tmux's own built-in default (2000). Passing
# `-f` on the same invocation makes tmux read THIS file — which sets the
# same `history-limit` — as part of starting the new server, before the
# session is created. Verified live to produce
# history_limit=50000 from cold. Harmless on a warm start: an
# already-running server ignores a client's `-f` (config files are only
# read at server startup), so the `-g set-option` call remains the thing
# actually doing the work in that case.
#
# Still fine to use by hand for a manual `dbrain attach` session:
# cp deploy/tmux.conf ~/.tmux.conf
#
# Larger scrollback so long replies stay capturable.
set -g history-limit 50000
# Don't keep dead panes around — the watchdog recreates the session cleanly.
set -g remain-on-exit off
